[versions]
agp                    = "8.5.2"
kotlin                 = "2.0.21"
compose-multiplatform  = "1.7.1"
coroutines             = "1.9.0"
serialization          = "1.7.3"
sqldelight             = "2.0.2"
koin                   = "3.6.0"
koin-compose           = "1.2.0"
androidx-lifecycle     = "2.8.4"
androidx-navigation    = "2.8.4"
androidx-activity      = "1.9.3"

[libraries]
# Kotlin / Coroutines
coroutines-core            = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",     version.ref = "coroutines" }
coroutines-android         = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",  version.ref = "coroutines" }
serialization-json         = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json",  version.ref = "serialization" }

# Koin
koin-core                  = { module = "io.insert-koin:koin-core",                          version.ref = "koin" }
koin-android               = { module = "io.insert-koin:koin-android",                       version.ref = "koin" }
koin-compose               = { module = "io.insert-koin:koin-compose",                       version.ref = "koin-compose" }
koin-compose-viewmodel     = { module = "io.insert-koin:koin-compose-viewmodel",             version.ref = "koin-compose" }

# SQLDelight
sqldelight-runtime         = { module = "app.cash.sqldelight:runtime",                       version.ref = "sqldelight" }
sqldelight-coroutines      = { module = "app.cash.sqldelight:coroutines-extensions",         version.ref = "sqldelight" }
sqldelight-android-driver  = { module = "app.cash.sqldelight:android-driver",               version.ref = "sqldelight" }
sqldelight-native-driver   = { module = "app.cash.sqldelight:native-driver",                version.ref = "sqldelight" }

# Lifecycle / ViewModel
lifecycle-viewmodel        = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel",         version.ref = "androidx-lifecycle" }
lifecycle-viewmodel-compose= { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
lifecycle-runtime-compose  = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose",   version.ref = "androidx-lifecycle" }

# Navigation
navigation-compose         = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

# Android
androidx-activity-compose  = { module = "androidx.activity:activity-compose",               version.ref = "androidx-activity" }

# ML Kit – text recognition (OCR for Android)
mlkit-text-recognition     = { module = "com.google.mlkit:text-recognition",                version = "16.0.1" }

[bundles]
koin-common    = ["koin-core", "koin-compose", "koin-compose-viewmodel"]
sqldelight     = ["sqldelight-runtime", "sqldelight-coroutines"]
lifecycle      = ["lifecycle-viewmodel", "lifecycle-viewmodel-compose", "lifecycle-runtime-compose"]

[plugins]
androidApplication     = { id = "com.android.application",                       version.ref = "agp" }
androidLibrary         = { id = "com.android.library",                           version.ref = "agp" }
kotlinMultiplatform    = { id = "org.jetbrains.kotlin.multiplatform",             version.ref = "kotlin" }
kotlinSerialization    = { id = "org.jetbrains.kotlin.plugin.serialization",      version.ref = "kotlin" }
composeMultiplatform   = { id = "org.jetbrains.compose",                          version.ref = "compose-multiplatform" }
composeCompiler        = { id = "org.jetbrains.kotlin.plugin.compose",            version.ref = "kotlin" }
sqldelight             = { id = "app.cash.sqldelight",                            version.ref = "sqldelight" }
